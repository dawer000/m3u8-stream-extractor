name: Auto Stream Extractor

on:
  schedule:
    - cron: '*/5 * * * *'  # Har 5 minute baad automatic trigger hoga
  workflow_dispatch:      # GitHub Actions tab se manually test karne ke liye

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Repository mein push permissions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Main Scraper Script
        run: python main.py

      - name: Commit and Push Updated Streams
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add extracted_stream.json
          git diff-index --quiet HEAD || git commit -m "Auto-update extracted m3u8 stream JSON"
          git push
